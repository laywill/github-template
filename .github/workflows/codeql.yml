---
name: CodeQL

# Trigger CodeQL analysis on pushes/PRs to main and on a weekly schedule so
# alerts surface even without recent code changes.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Uncomment the languages actually present in this project. See
        # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning#changing-the-languages-that-are-analyzed
        # for the full list of supported identifiers.
        language:
          # - actions
          # - c-cpp
          # - csharp
          # - go
          # - java-kotlin
          # - javascript-typescript
          # - python
          # - ruby
          # - rust
          # - swift
          - actions

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3c1cfa5126ffdcc6901741c83d08ef558a09e3d1  # v3.37.5
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@3c1cfa5126ffdcc6901741c83d08ef558a09e3d1  # v3.37.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3c1cfa5126ffdcc6901741c83d08ef558a09e3d1  # v3.37.5
        with:
          category: "/language:${{ matrix.language }}"
